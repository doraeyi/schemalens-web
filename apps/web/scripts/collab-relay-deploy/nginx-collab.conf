# 這是給「對外 TLS 由更外層終結、這台機器只講 http、靠路徑轉給不同後端服務」
# 這種架構參考的範例（原始情境：NAS 的外層 nginx 終結 TLS，這台機器 443 已經
# 拿掉）。如果你的架構不是這樣（例如這台機器本身就直接處理 TLS），這個路徑式
# location 不適用，改用獨立 server{} block + 自己的網域/憑證。
#
# 把這個 location 區塊貼進 /etc/nginx/sites-available/default 裡，跟
# `location /yiwallet/ { ... }`同一層、放在同一個 server{} 裡面即可：
#   sudo nano /etc/nginx/sites-available/default   ← 貼進去
#   sudo nginx -t && sudo systemctl reload nginx
# 不需要另外跑 certbot——這台機器本來就不管憑證。

	# 即時協作 relay（schemalens-collab）
	location /collab/ {
		proxy_pass http://127.0.0.1:1234/;
		proxy_http_version 1.1;

		# WebSocket 升級一定要的兩個 header。
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;

		# WS 連線是長連線，預設的 60s read timeout 會把閒置中的協作連線斷掉，
		# 拉長一點——真的斷線靠 y-websocket 自己的 ping/reconnect 機制處理。
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
